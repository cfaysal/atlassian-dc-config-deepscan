name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GROOVY_VERSION: "3.0.21"

jobs:
  verify:
    name: ${{ matrix.product }} parse check and offline tests
    runs-on: ubuntu-latest

    # One leg per shipped endpoint. A single hard-coded path meant a new endpoint
    # passed through zero gates while the run still reported green: a rule enforced
    # for one product only is not enforced (Golden Rule 16).
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: jira
            endpoint: jira/jiraDCprojectConfig.groovy
            tests: jira/tests/jiraDCprojectConfig.tests.groovy
            banner: END OF THE JIRA-FREE BLOCK
          - product: confluence
            endpoint: confluence/confluenceDCspaceConfig.groovy
            tests: confluence/tests/confluenceDCspaceConfig.tests.groovy
            banner: END OF THE CONFLUENCE-FREE BLOCK
          - product: confluence-probe
            endpoint: confluence/tools/spaceConfigReachabilityProbe.groovy
            tests: ""
            banner: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Groovy distribution
        id: groovy-cache
        uses: actions/cache@v4
        with:
          path: ~/groovy
          key: groovy-${{ env.GROOVY_VERSION }}

      - name: Download Groovy
        if: steps.groovy-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/groovy
          curl -fsSL -o /tmp/groovy.zip \
            "https://archive.apache.org/dist/groovy/${GROOVY_VERSION}/distribution/apache-groovy-binary-${GROOVY_VERSION}.zip"
          unzip -q /tmp/groovy.zip -d ~/groovy

      # The whole lib directory cannot go on the classpath. Groovy registers an
      # extension module from every jar it finds, and groovy-jaxb needs
      # javax.xml.bind, which was removed from the JDK in version 11. Its
      # registration then fails before a single line of the script is parsed, with
      # an error that looks like a script problem and is not one. Exclude it.
      - name: Resolve Groovy classpath
        run: |
          set -euo pipefail
          GROOVY_HOME=$(find ~/groovy -maxdepth 1 -type d -name "groovy-*" | head -1)
          GROOVY_CP=$(find "$GROOVY_HOME/lib" -name '*.jar' ! -name '*jaxb*' -print0 \
                      | sort -z | tr '\0' ':')
          echo "GROOVY_HOME=$GROOVY_HOME" >> "$GITHUB_ENV"
          echo "GROOVY_CP=$GROOVY_CP" >> "$GITHUB_ENV"
          echo "classpath jars: $(find "$GROOVY_HOME/lib" -name '*.jar' ! -name '*jaxb*' | wc -l)"
          java -cp "$GROOVY_CP" groovy.ui.GroovyMain -e 'println "groovy " + GroovySystem.version'

      # The parse check compiles the endpoint to the CONVERSION phase. That validates
      # syntax without resolving a single Jira symbol, which is the most that can be
      # verified off-instance. It does not prove the script runs.
      - name: Parse check
        run: |
          set -euo pipefail
          F='${{ matrix.endpoint }}'
          if [ ! -f "$F" ]; then
            echo "::error title=Missing::$F is not in the repository."
            exit 1
          fi
          java -Dfile.encoding=UTF-8 -cp "$GROOVY_CP" groovy.ui.GroovyMain tools/parsecheck.groovy "$F"

      # The suite is compiled together with the helper classes cut from the endpoint
      # itself, so it always tests the shipped source rather than a copy that can drift.
      # Everything between the two markers is deliberately free of Jira types.
      - name: Offline test suite
        run: |
          set -euo pipefail
          F='${{ matrix.endpoint }}'
          T='${{ matrix.tests }}'
          BANNER='${{ matrix.banner }}'
          if [ -z "$T" ]; then
            echo "::notice title=No suite::$F ships without an offline suite."
            exit 0
          fi
          if [ ! -f "$T" ]; then
            echo "::notice title=Not present::Test suite missing, suite skipped."
            exit 0
          fi
          START=$(grep -n '^class Pc {' "$F" | cut -d: -f1)
          END=$(( $(grep -n "^ \* $BANNER$" "$F" | cut -d: -f1) - 2 ))
          if [ -z "$START" ] || [ "$END" -le "$START" ]; then
            echo "::error title=Cut markers moved::Could not locate the helper class block in $F."
            exit 1
          fi
          { echo 'import groovy.json.JsonOutput'
            echo 'import org.codehaus.groovy.runtime.InvokerHelper'
            echo 'import java.time.ZonedDateTime'
            echo 'import java.time.format.DateTimeFormatter'
            sed -n "${START},${END}p" "$F"
            cat "$T"
          } > /tmp/testsuite.groovy
          java -Xmx2g -Dfile.encoding=UTF-8 -cp "$GROOVY_CP" groovy.ui.GroovyMain /tmp/testsuite.groovy

  hygiene:
    name: Publication hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # This script is pasted into an administrative console on a production
      # instance. A credential or an internal hostname reaching this repository
      # would be a real incident, so the gate runs on every change rather than on
      # trust in a past scan.
      - name: Scan for credentials and internal references
        run: |
          set -uo pipefail
          fail=0
          files=$(git ls-files '*.groovy')
          [ -z "$files" ] && { echo "No Groovy files to scan yet."; exit 0; }
          for f in $files; do
            hits=$(grep -nEi 'password[[:space:]]*=|api[_-]?key[[:space:]]*=|bearer[[:space:]]+[A-Za-z0-9]|BEGIN (RSA|OPENSSH|DSA|EC|PRIVATE)|xox[baprs]-|ATATT[A-Za-z0-9]|gh[pous]_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|192\.168\.[0-9]+\.[0-9]+' "$f" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Possible credential or internal reference"
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      # Producing a report must contact nothing outside the instance, in any format.
      # Two families are checked, and the second is the one a naive job would miss:
      # an application link call goes through ApplicationLinkRequestFactory and
      # matches none of the raw-HTTP patterns, so a grep for URLConnection alone
      # would report green while an outbound call existed.
      #
      # Raw HTTP is forbidden outright. Application links are allowed in exactly one
      # place, the Confluence export transport, and the job proves that rather than
      # trusting it: every applinks hit must sit at or below the line where that
      # section starts. An applinks call that drifts into the analysis - which is
      # what would turn a read-only report into one that phones out - fails here.
      - name: Assert no undeclared outbound network call
        run: |
          set -uo pipefail
          fail=0
          files=$(git ls-files '*.groovy')
          [ -z "$files" ] && exit 0
          raw='new URL\(|URLConnection|HttpURLConnection|HttpClient|\.toURL\(\)|Socket\('
          applinks='ApplicationLink|createAuthenticatedRequestFactory|createImpersonatingAuthenticatedRequestFactory'
          banner='^ \* Confluence application link transport$'
          for f in $files; do
            hits=$(grep -nE "$raw" "$f" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Raw HTTP, which this project does not allow anywhere"
              echo "$hits"
              fail=1
            fi

            # An import declares nothing and calls nothing, and Groovy requires it at
            # the top of the file, so it cannot live inside the transport section. The
            # rule is about where the CALLS are, so import lines are excluded here and
            # nowhere else.
            applinkHits=$(grep -nE "$applinks" "$f" | grep -vE '^[0-9]+:import ' || true)
            [ -z "$applinkHits" ] && continue

            start=$(grep -nE "$banner" "$f" | head -1 | cut -d: -f1 || true)
            if [ -z "$start" ]; then
              echo "::error file=$f::This file uses application links but declares no transport section."
              echo "$applinkHits"
              fail=1
              continue
            fi
            stray=$(echo "$applinkHits" | awk -F: -v s="$start" '$1 < s')
            if [ -n "$stray" ]; then
              echo "::error file=$f::Application link use outside the declared transport section (starts at line $start)"
              echo "$stray"
              fail=1
            fi
          done
          exit $fail

      # A helper named "call" is unusable in this file and the compiler will not say
      # so. Every reader in the Service Management section runs inside a closure, and
      # inside a closure an unqualified call(a, b, c) binds to Closure.call - the
      # closure's own invocation operator - instead of to the static method of the
      # enclosing class. The section died on its first line for exactly that reason,
      # naming the closure as the receiver. It survived review because in an ordinary
      # method the identical call resolves correctly, so a reader checking one call
      # site proves nothing about another.
      #
      # This is the enforcement point rather than a comment, because a comment binds
      # only the reader who happens to open that file. Qualified calls (obj.call(x))
      # are untouched; only a bare call( is refused. Comment lines are excluded so the
      # explanation above can quote the offending form.
      - name: Refuse a bare call( that a closure would shadow
        run: |
          set -uo pipefail
          fail=0
          files=$(git ls-files '*.groovy')
          [ -z "$files" ] && exit 0
          for f in $files; do
            hits=$(grep -nE '(^|[^.[:alnum:]_])call[[:space:]]*\(' "$f" \
                   | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Unqualified call( - inside a closure this resolves to Closure.call, not to your method. Give the helper a distinct name."
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      # The table renderer is duplicated on purpose: each endpoint has to stay a
      # single self-contained file, because it is dropped into a script root on its
      # own. That rules out a shared module, so nothing but this job keeps the two
      # copies honest. It changed four times on 2026-08-27 alone; any one of those
      # could have landed in one file only.
      #
      # Comments are excluded from the comparison on purpose. They may differ per
      # product, and forcing them to match would produce worse comments rather than
      # better code.
      - name: Assert the shared table renderer has not drifted
        run: python3 tools/shared-renderer-drift.py

      # Slice 1 of OP-1005 shipped a literal 0x00 inside a string. Git, grep, diff
      # and every review tool then treated the file as BINARY: the diff was
      # unreadable, the offline suite could not be cut out of it and CI broke on a
      # change nobody could see. The cause was a CSS escape inside a Groovy string,
      # where a backslash followed by digits is an octal escape and \2 is a control
      # character - two escaping layers over one glyph.
      #
      # The offline suite asserts that no control character reaches the rendered
      # PAGE. That is a different claim from this one and neither implies the
      # other: a control byte can sit in a comment, in a table of constants or in
      # a string the suite never renders, and break every text tool just the same.
      # This gate is about the SOURCE.
      #
      # Tab, newline and carriage return are the three that legitimately appear in
      # text. Everything else below 0x20, plus DEL, is refused.
      - name: Refuse a raw control byte in any tracked text file
        run: |
          set -uo pipefail
          fail=0
          for f in $(git ls-files); do
            case "$f" in *.png|*.jpg|*.pdf) continue;; esac
            hits=$(LC_ALL=C grep -nP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' "$f" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Raw control byte in the source. Text tools treat this file as binary. Write the glyph as a literal character, never as an escape that two layers will read."
              echo "$hits" | LC_ALL=C sed -n '1,5p' | cat -v
              fail=1
            fi
          done
          exit $fail

      # This endpoint claims, in its own header, that every statement it issues is
      # a SELECT, and it backs that with a read-only SAL executor. The claim is
      # worth only as much as its enforcement: a reviewer reading 6000 lines will
      # eventually miss one. Comment lines are excluded so the rule can be
      # explained without tripping over itself.
      #
      # Each verb is matched in its SQL SHAPE rather than as a bare word. A
      # permission GRANT is the subject matter of this endpoint and the word
      # appears in prose in dozens of strings, so the pattern requires the object
      # that a real GRANT statement carries. A gate that cries wolf gets loosened
      # by the next person in a hurry, and then it guards nothing.
      - name: Assert every statement is a SELECT
        run: |
          set -uo pipefail
          fail=0
          files=$(git ls-files '*.groovy')
          [ -z "$files" ] && exit 0
          write='"[^"]*\b(INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[a-z_]+[[:space:]]+SET|DELETE[[:space:]]+FROM|DROP[[:space:]]+(TABLE|INDEX|VIEW)|ALTER[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE|CREATE[[:space:]]+(TABLE|INDEX|VIEW)|GRANT[[:space:]]+(ALL|SELECT|INSERT|UPDATE|DELETE|EXECUTE)|MERGE[[:space:]]+INTO)\b'
          for f in $files; do
            hits=$(grep -nEi "$write" "$f" | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::A statement that is not a SELECT. This endpoint is read-only and says so in its header."
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      # The script has to run on ScriptRunner 8.x to 9.x, which is javax.ws.rs, and
      # on 10.x and above, which is jakarta.ws.rs. The namespace follows the
      # SCRIPTRUNNER version rather than the product version, so naming either one
      # statically pins the file to one line of ScriptRunner and it will not even
      # compile on the other. The JAX-RS Response class is resolved at runtime for
      # exactly this reason. An import is easy to add back by habit, so it is
      # refused here rather than remembered.
      - name: Refuse a jakarta or javax import
        run: |
          set -uo pipefail
          fail=0
          files=$(git ls-files '*.groovy')
          [ -z "$files" ] && exit 0
          for f in $files; do
            hits=$(grep -nE '^[[:space:]]*import[[:space:]]+(jakarta|javax)\.' "$f" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::A jakarta or javax import pins this file to one ScriptRunner line. Resolve the type at runtime instead."
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      # SPACEPERMISSIONS holds the GLOBAL permissions of the instance as well as
      # the per-space grants, and the global rows carry a NULL spaceid: measured on
      # the reference instance, SYSTEMADMINISTRATOR, ADMINISTRATECONFLUENCE,
      # USECONFLUENCE, CREATESPACE, PERSONALSPACE and BROWSEALLGROUPMEMBERS.
      #
      # An estate query that aggregates that table without restricting to rows that
      # HAVE a spaceid reports the system-administrator right of the instance as a
      # grant on some space. It produces a plausible number, so no test of the
      # rendering catches it and no reviewer notices. The guard is on the statement
      # text because that is where the mistake is made.
      - name: Assert the estate sweep restricts SPACEPERMISSIONS to per-space rows
        run: |
          set -uo pipefail
          F=confluence/confluenceDCspaceConfig.groovy
          [ -f "$F" ] || { echo "::notice::$F is not in the repository."; exit 0; }
          sweep=$(sed -n '/static final String SWEEP_SQL =/,/^$/p' "$F")
          if [ -z "$sweep" ]; then
            echo "::error file=$F::SWEEP_SQL not found. The estate sweep statement is the thing this gate exists to check."
            exit 1
          fi
          fail=0
          echo "$sweep" | grep -q 'FROM spacepermissions p ' || {
            echo "::error file=$F::SWEEP_SQL no longer reads spacepermissions the way this gate understands."; fail=1; }
          echo "$sweep" | grep -q 'WHERE p.spaceid IS NOT NULL' || {
            echo "::error file=$F::SWEEP_SQL aggregates SPACEPERMISSIONS without restricting to rows that carry a spaceid. The global permissions of the instance would be counted as grants on a space."; fail=1; }
          echo "$sweep" | grep -q 'ON g.sid = s.spaceid' || {
            echo "::error file=$F::SWEEP_SQL no longer joins the per-space aggregate on spaceid."; fail=1; }
          [ "$fail" = 0 ] && echo "The estate sweep joins on spaceid and excludes the global permission rows."
          exit $fail
